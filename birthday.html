<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🤍</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #342631 0%,
            #121015 55%,
            #07070a 100%
        );

    overflow: hidden;

}


/* =========================
   CARD
========================= */

.card {

    width: 90%;

    max-width: 420px;

    padding: 40px 28px;

    text-align: center;

    border-radius: 30px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.14);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.5);

    position: relative;

    z-index: 10;

    animation:
        cardAppear 1.2s ease;

}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.94);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   CAKE
========================= */

.cake {

    font-size: 75px;

    animation:
        cakeFloat 2s ease-in-out infinite;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,255,255,0.18)
        );

}


@keyframes cakeFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-10px)
            rotate(2deg);

    }

}


/* =========================
   SMALL TITLE
========================= */

.small {

    margin-top: 15px;

    font-size: 12px;

    letter-spacing: 4px;

    color: #aaa;

    text-transform: uppercase;

}


/* =========================
   MAIN TITLE
========================= */

h1 {

    font-size: 36px;

    line-height: 1.2;

    margin: 20px 0;

    min-height: 87px;

}


.name {

    color: #efbfd0;

    text-shadow:
        0 0 15px
        rgba(239,191,208,0.3);

}


/* =========================
   MESSAGE
========================= */

.message {

    color: #c5c2c8;

    line-height: 1.8;

    font-size: 15px;

    min-height: 190px;

}


/* =========================
   SIGNATURE
========================= */

.signature {

    margin-top: 25px;

    color: white;

    font-size: 14px;

    letter-spacing: 1px;

    min-height: 20px;

}


/* =========================
   TYPING CURSOR
========================= */

.cursor {

    display: inline-block;

    width: 2px;

    height: 17px;

    background: white;

    margin-left: 3px;

    vertical-align: middle;

    animation:
        blink .7s infinite;

}


@keyframes blink {

    0%,
    50% {

        opacity: 1;

    }

    51%,
    100% {

        opacity: 0;

    }

}


/* =========================
   FLOATING HEARTS
========================= */

.heart {

    position: fixed;

    color: white;

    font-size: 23px;

    opacity: 0;

    pointer-events: none;

    z-index: 2;

    text-shadow:
        0 0 10px
        rgba(255,255,255,0.35);

    animation:
        heartUp 8s linear infinite;

}


.heart:nth-of-type(1) {

    left: 6%;

    animation-delay: 0s;

}

.heart:nth-of-type(2) {

    left: 15%;

    font-size: 17px;

    animation-delay: 2s;

}

.heart:nth-of-type(3) {

    left: 9%;

    font-size: 27px;

    animation-delay: 4s;

}

.heart:nth-of-type(4) {

    right: 6%;

    animation-delay: 1s;

}

.heart:nth-of-type(5) {

    right: 16%;

    font-size: 18px;

    animation-delay: 3s;

}

.heart:nth-of-type(6) {

    right: 9%;

    font-size: 26px;

    animation-delay: 5s;

}


@keyframes heartUp {

    0% {

        bottom: -40px;

        opacity: 0;

        transform:
            translateX(0)
            rotate(0deg)
            scale(.7);

    }

    15% {

        opacity: .8;

    }

    50% {

        transform:
            translateX(25px)
            rotate(15deg)
            scale(1);

    }

    80% {

        opacity: .45;

    }

    100% {

        bottom: 110%;

        opacity: 0;

        transform:
            translateX(-20px)
            rotate(-15deg)
            scale(.8);

    }

}


/* =========================
   SPARKLES
========================= */

.sparkle {

    position: fixed;

    color: white;

    font-size: 18px;

    opacity: 0;

    pointer-events: none;

    z-index: 3;

    text-shadow:
        0 0 12px white;

    animation:
        sparkleAnim 3s ease-in-out infinite;

}


.sparkle:nth-of-type(7) {

    left: 10%;

    top: 27%;

}

.sparkle:nth-of-type(8) {

    left: 22%;

    top: 67%;

    animation-delay: .8s;

}

.sparkle:nth-of-type(9) {

    right: 10%;

    top: 31%;

    animation-delay: 1.5s;

}

.sparkle:nth-of-type(10) {

    right: 21%;

    top: 70%;

    animation-delay: 2s;

}

.sparkle:nth-of-type(11) {

    left: 14%;

    top: 48%;

    animation-delay: 2.5s;

}

.sparkle:nth-of-type(12) {

    right: 14%;

    top: 53%;

    animation-delay: 1s;

}


@keyframes sparkleAnim {

    0%,
    100% {

        opacity: 0;

        transform:
            scale(.4)
            rotate(0deg);

    }

    50% {

        opacity: .9;

        transform:
            scale(1.5)
            rotate(90deg);

    }

}


/* =========================
   LITTLE PARTY ELEMENTS
========================= */

.party {

    position: fixed;

    z-index: 1;

    pointer-events: none;

    font-size: 18px;

    opacity: 0;

    animation:
        partyFloat 7s ease-in-out infinite;

}


.party:nth-of-type(13) {

    left: 4%;

    top: 42%;

    animation-delay: 1s;

}

.party:nth-of-type(14) {

    right: 4%;

    top: 45%;

    animation-delay: 3s;

}

.party:nth-of-type(15) {

    left: 25%;

    top: 13%;

    animation-delay: 4s;

}

.party:nth-of-type(16) {

    right: 25%;

    top: 16%;

    animation-delay: 6s;

}


@keyframes partyFloat {

    0%,
    100% {

        opacity: 0;

        transform:
            translateY(10px)
            rotate(0deg);

    }

    50% {

        opacity: .65;

        transform:
            translateY(-20px)
            rotate(15deg);

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 400px) {

    h1 {

        font-size: 32px;

    }

    .cake {

        font-size: 70px;

    }

    .message {

        font-size: 14px;

    }

}

</style>

</head>


<body>


<!-- FLOATING HEARTS -->

<div class="heart">♡</div>
<div class="heart">♥</div>
<div class="heart">♡</div>
<div class="heart">♥</div>
<div class="heart">♡</div>
<div class="heart">♥</div>


<!-- SPARKLES -->

<div class="sparkle">✦</div>
<div class="sparkle">✧</div>
<div class="sparkle">✦</div>
<div class="sparkle">✧</div>
<div class="sparkle">⋆</div>
<div class="sparkle">✦</div>


<!-- LITTLE PARTY ELEMENTS -->

<div class="party">✨</div>
<div class="party">🎀</div>
<div class="party">✨</div>
<div class="party">💫</div>


<!-- MAIN CARD -->

<div class="card">


    <!-- CAKE -->

    <div class="cake">

        🎂

    </div>


    <!-- SMALL TEXT -->

    <div class="small">

        today is your day

    </div>


    <!-- TYPING TITLE -->

    <h1 id="title">

        <span class="cursor"></span>

    </h1>


    <!-- TYPING MESSAGE -->

    <div class="message" id="message">

    </div>


    <!-- SIGNATURE -->

    <div class="signature" id="signature">

    </div>


</div>


<script>


/* =========================
   TYPING FUNCTION
========================= */

function typeText(element, text, speed, callback) {

    let index = 0;

    const cursor =
        document.createElement("span");

    cursor.className = "cursor";


    function type() {

        if (index < text.length) {

            element.textContent +=
                text.charAt(index);

            element.appendChild(cursor);

            index++;

            setTimeout(type, speed);

        }

        else {

            if (callback) {

                setTimeout(
                    callback,
                    700
                );

            }

        }

    }


    type();

}


/* =========================
   START ANIMATION
========================= */

window.onload = function() {


    const title =
        document.getElementById("title");

    const message =
        document.getElementById("message");

    const signature =
        document.getElementById("signature");


    /* TITLE */

    typeText(

        title,

        "Happy Birthday, Nemiii 🤍",

        70,

        function() {


            /* MESSAGE */

            typeText(

                message,

                "I hope this year brings you more reasons to smile,\nmore moments worth remembering,\nand more things that make you genuinely happy.\n\nYou deserve good things, good people,\nand days that feel a little lighter.\n\nEnjoy your day.\nHappy birthday. 🤍",

                28,

                function() {


                    /* SIGNATURE */

                    typeText(

                        signature,

                        "Keep smiling. You look good doing it. ✨",

                        50

                    );

                }

            );

        }

    );

};

</script>


</body>

</html>
